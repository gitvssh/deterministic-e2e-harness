[project]
name = "deterministic-e2e-harness"
version = "1.0.0"
description = "Document-driven E2E test harness with AI-assisted compilation and deterministic Hurl execution"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
  "cyclonedx-bom==7.3.1",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pip-licenses==5.5.5",
  "pytest==9.1.1",
  "ruff==0.16.3",
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["examples/payment_flow/app", "scripts", "tests"]
warn_unreachable = true
